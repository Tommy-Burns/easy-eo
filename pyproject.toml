[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-eo"
version = "0.2.0"
description = "A lightweight Earth Observation utilities library for chainable raster operations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["remote sensing", "earth observation", "raster", "gis"]

authors = [
    { name = "Thomas Burns Botchwey", email = "" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]


dependencies = [
    "rasterio>=1.4,<2",
    "geopandas>=1.1,<2",
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# STAC data access (eeo.io.stac). pystac-client drives the search; the
# planetary-computer helper signs Microsoft Planetary Computer asset URLs.
# Both are capped below their next major version: pystac-client is pre-1.0 and
# still changes its client API between minors.
stac = [
    "pystac-client>=0.8,<1",
    "planetary-computer>=1.0,<2",
]
# xarray interop (EEORasterDataset.to_xarray / eeo.from_xarray). xarray builds
# the labelled array; rioxarray carries the georeferencing (CRS, transform,
# nodata) on it. rioxarray is capped below its next major version because it is
# pre-1.0 and still changes its accessor API between minors; xarray uses
# CalVer, breaks rarely, and is left uncapped.
xarray = [
    "xarray>=2024.7",
    "rioxarray>=0.17,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/tommy-burns/easy-eo"
Repository = "https://github.com/tommy-burns/easy-eo"
Documentation = "https://easy-eo.readthedocs.io"
Issues = "https://github.com/tommy-burns/easy-eo/issues"


# ---------------------
# Hatch build settings
# ---------------------
[tool.hatch.build]
include = [
    "eeo",
]

[tool.hatch.build.targets.wheel]
packages = ["eeo"]

# PEP 561: the py.typed marker and the generated core stub must ship in the
# wheel so downstream type checkers pick up Easy-EO's inline annotations and
# the dynamically-bound method signatures.
[tool.hatch.build.targets.wheel.force-include]
"eeo/py.typed" = "eeo/py.typed"
"eeo/core/core.pyi" = "eeo/core/core.pyi"

# Optional but handy
[tool.hatch.envs.default]
dependencies = [
    "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest"

# ---------------------
# Ruff (lint + format)
# ---------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["eeo", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle (numpy convention, see [tool.ruff.lint.pydocstyle])
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["eeo"]

[tool.ruff.lint.per-file-ignores]
# eeo/__init__.py re-exports submodules with `import *` so that importing
# them registers ops on EEORasterDataset via the @eeo_raster_op /
# @eeo_raster_viz decorators (see eeo/core/decorators.py) — this is a
# deliberate plugin-registration side effect, not an oversight.
"eeo/__init__.py" = ["F403"]
# Docstring rules target the library's public API only. Tests, the stub
# generator, and docs config are exempt from D-category checks.
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
# The adapter contract is documented once on the BaseRasterAdapter ABC
# (eeo/core/adapters/base.py); the concrete backends only implement it, so
# per-method docstrings on the overrides would just duplicate the interface.
"eeo/core/adapters/numpy.py" = ["D102"]
"eeo/core/adapters/rasterio.py" = ["D102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------
# mypy (type checking)
# ---------------------
[tool.mypy]
# modern numpy (>=2.2) ships stubs that use PEP
# 695 `type` statements, which mypy only parses when python_version >= 3.12.
# Runtime support still starts at 3.10 (enforced by ruff target-version and the
# py3.10 test-matrix leg); this only sets the language level mypy assumes.
python_version = "3.12"
files = ["eeo"]
namespace_packages = true
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# The geospatial stack ships no type information of its own, so mypy cannot
# analyze it. Suppress the resulting import-untyped noise rather than
# annotating third-party internals. (shapely has a community stub package,
# types-shapely, which we deliberately do not adopt: it would type one corner
# of a stack that is otherwise unanalyzable either way.)
[[tool.mypy.overrides]]
module = [
    "rasterio",
    "rasterio.*",
    "geopandas",
    "shapely",
    "affine",
    "pyproj",
    "pyproj.*",
]
ignore_missing_imports = true

# ---------------------
# pytest
# ---------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "network: test performs a real network download (opt in with --run-network)",
]
# Coverage is always measured; the suite fails below the documented ≥80%
# target (see CODE_STYLE.md "Testing Expectations").
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=eeo",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
xfail_strict = true
# Surface warnings as failures so deprecations and numerical warnings can't
# slip through unnoticed. Tests that expect a warning use pytest.warns.
filterwarnings = [
    "error",
    # rasterio 1.5.x sets `.shape` on ndarrays inside its Cython read path;
    # numpy 2.5 deprecated that. Out of our control until rasterio ships a
    # fix — ignore the specific message rather than weakening the gate.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # planetary-computer (the [stac] extra) still declares its pydantic models
    # with a class-based Config, which pydantic 2 deprecates on import. Out of
    # our control until planetary-computer migrates.
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]

# ---------------------
# coverage.py
# ---------------------
[tool.coverage.run]
source = ["eeo"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# ---------------------
# numpydoc validation
# ---------------------
# Complements ruff's pydocstyle (D) rules with section/signature consistency
# checks (parameters match the signature, Returns present with a description,
# etc.). Applied in CI (`numpydoc lint`) and pre-commit to the public
# operation API only — ops, analysis, preprocessing, viz, the loaders, and
# show_versions. Internal infrastructure (EEORasterDataset getters and dunder
# operators, decorator factories, alignment/resampling helpers) uses concise
# docstrings by design; ruff's D-rules still require those to be well-formed.
# The optional-narrative checks are disabled so a concise summary suffices.
[tool.numpydoc_validation]
checks = [
    "all",
    "ES01", # extended summary not required
    "EX01", # examples not required on every object
    "SA01", # "See Also" not required
    "GL08", # missing-docstring is enforced by ruff (D-rules)
    "GL01", # conflicts with the one-line-summary style ruff enforces
    "GL02", # allow the closing quotes on the summary line
]
exclude = [
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
    # Module-private helpers (leading underscore) use concise docstrings by
    # design, same as the internal infrastructure noted above; ruff's D-rules
    # still require those to be well-formed.
    '(^|\.)_[a-zA-Z]\w*$',
]
