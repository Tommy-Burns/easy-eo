version: 2
updates:
  # Python dependencies: keep uv.lock current within the ranges declared in
  # pyproject.toml. Dependabot opens reviewed PRs; the maintainer merges them.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # One PR for dev-tooling bumps (pytest, ruff, mypy, pre-commit, ...).
      dev-dependencies:
        dependency-type: "development"
      # One PR for runtime dependency bumps (rasterio, numpy, geopandas, ...).
      runtime-dependencies:
        dependency-type: "production"

  # The exact pins in docs/requirements.txt, installed by both Read the Docs
  # and the CI docs job. Pins do not bump themselves, and an unwatched docs
  # toolchain silently ages out of the versions everyone else is running.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "documentation"
    groups:
      # One PR for the whole docs toolchain: Sphinx and its theme/extensions
      # are upgraded together or not at all.
      docs-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in the workflows (checkout, setup-uv, codecov, ...).
  # Weekly, not monthly: the actions are pinned to commit SHAs, so they no
  # longer pick up their own patches and this is what keeps them current.
  # Advisories do not wait for it — Dependabot security updates cover actions
  # and raise a PR when one is published.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
