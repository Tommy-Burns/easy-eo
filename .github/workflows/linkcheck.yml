name: Link check

# Scheduled link checks of links in the notebooks and docs to make sure they are still intact
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked environment
        run: uv sync --frozen

      # Broken links set the exit code on their own.
      - name: Check documentation links
        run: >
          uv run --no-sync --with-requirements docs/requirements.txt
          sphinx-build -b linkcheck docs/source docs/build/linkcheck

  markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sphinx only sees the documentation tree, so the README - which carries
      # the badges, the PyPI-facing image URLs, and the Colab links - would
      # otherwise go unchecked.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress --max-retries 3
            README.md CONTRIBUTING.md CHANGELOG.md examples/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notebooks:
    name: Notebook links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Colab answers 200 for any URL, including notebooks and repositories
      # that do not exist, so these links are checked structurally instead.
      - name: Check Open in Colab links
        run: python3 scripts/check_colab_links.py

      # Checks relative links in the ipynb
      - name: Check relative links and extract notebook prose
        run: python3 scripts/check_notebook_links.py --output .linkcheck

      # Web links only only checks
      - name: Check notebook web links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress --max-retries 3
            --scheme http --scheme https
            .linkcheck
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
