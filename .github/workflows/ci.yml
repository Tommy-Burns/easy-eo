name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check eeo tests

      - name: Ruff format check
        run: uv run ruff format --check eeo tests

      - name: mypy
        run: uv run mypy

      # Section/signature consistency on the public operation API, per
      # [tool.numpydoc_validation]. Run ephemerally so numpydoc's sphinx
      # dependency stays out of the locked dev environment.
      - name: Validate docstrings (numpydoc)
        run: >
          uvx --from numpydoc numpydoc lint
          eeo/ops/*.py eeo/analysis/*.py eeo/preprocessing/*.py eeo/viz/*.py
          eeo/io/*.py eeo/core/loader.py eeo/_show_versions.py

      - name: Core stub freshness
        run: uv run python scripts/generate_core_stub.py --check

  test:
    name: Test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 is tested because conda-forge already resolves it by default for
        # `conda install easy-eo`, so users are on it whether or not we claim it.
        # Known cosmetic artifact on 3.14 only: the full suite intermittently
        # (~30% of runs) prints a few "Error in sys.excepthook: / Original
        # exception was:" blocks on stderr *after* the summary, with both
        # tracebacks empty. Tests all pass and the exit code is 0. It is a
        # CPython 3.14 interpreter-finalization artifact, not ours: 3.13 with
        # the identical dependency set is clean, no individual test file
        # reproduces it, and it survives both a forced GC before shutdown and a
        # teardown-safe rewrite of EEORasterDataset.__del__. Nothing to fix here
        # — do not chase it if you see it in a log.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The optional extras are installed here so their "installed" path is
      # exercised; the "absent" path is covered by simulating the missing
      # import, so both cases run in every environment.
      - name: Install locked environment
        run: uv sync --frozen --extra dev --extra stac --extra xarray

      - name: Run tests with coverage
        run: uv run pytest --cov-report=xml

      # Upload coverage once, from a single representative job, to avoid
      # redundant reports across the full matrix.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Executes the tutorial notebooks top to bottom, so a change that breaks a
  # documented workflow fails here rather than in a reader's Colab session.
  # The four STAC notebooks are excluded automatically: they query a live
  # catalog, and declare that in their own metadata (see examples/conftest.py).
  notebooks:
    name: Tutorial notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # The notebooks share one ~28 MB sample; cache it so only the first run
      # on a given registry downloads anything. The key tracks the registry,
      # which pins every asset's URL and checksum.
      - name: Cache sample data
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sample-cache
          key: eeo-sample-${{ hashFiles('eeo/datasets/_registry.py') }}

      # Both extras are installed so the notebooks run the same way a reader
      # who followed examples/README.md would run them.
      - name: Install locked environment
        run: uv sync --frozen --extra dev --extra stac --extra xarray

      # Fetch the sample in one explicit step, so a download failure reports as
      # a download failure rather than as a notebook failure, and so the
      # notebooks themselves execute entirely offline.
      - name: Warm the sample cache
        env:
          EEO_DATA_DIR: ${{ github.workspace }}/.sample-cache
        run: uv run --no-sync python -c "from eeo.datasets import load_sample_dataset; load_sample_dataset(prefetch=True)"

      # nbmake and the Jupyter kernel it drives are needed only here, so they
      # are layered on ephemerally rather than added to the locked dev
      # environment (same reasoning as numpydoc in the lint job); --no-sync
      # keeps that overlay from disturbing the extras installed above.
      #
      # Run serially: the whole set takes about 90 seconds, and running kernels
      # in parallel mainly buys kernel-startup contention (a 60 s startup
      # timeout that flakes) for the sake of half a minute.
      #
      # Coverage is off because the notebooks execute in a separate kernel
      # process, where the suite's --cov-fail-under gate would measure nothing.
      - name: Execute notebooks
        env:
          EEO_DATA_DIR: ${{ github.workspace }}/.sample-cache
        run: >
          uv run --no-sync --with nbmake
          pytest --nbmake --no-cov --nbmake-timeout=900 examples/

  # Sphinx builds on Read the Docs only after a merge or a tag, so a broken
  # cross-reference, an unresolvable autodoc target, or a docstring that no
  # longer parses reaches main before anyone sees it. This job builds the same
  # docs on every PR with warnings promoted to errors.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"


      - name: Install locked environment
        run: uv sync --frozen

      - name: Build docs (warnings are errors)
        run: >
          uv run --no-sync --with-requirements docs/requirements.txt
          sphinx-build -W -b html docs/source docs/build/html

  min-versions:
    name: Minimum supported versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.10"

      # Resolve the lowest versions of the direct dependencies (per their
      # pyproject lower bounds) to prove the declared floor actually works.
      # `uv pip` resolves for this interpreter specifically — unlike the
      # universal `uv sync` — so it can pick e.g. numpy 1.26, which has no
      # wheels for the newest Python. The lockfile is deliberately ignored.
      - name: Install lowest supported dependency versions
        run: |
          uv venv --python 3.10 --clear
          uv pip install --resolution lowest-direct -e ".[dev,stac,xarray]"

      # Old dependency versions legitimately emit their own deprecation
      # warnings (e.g. matplotlib via pyparsing); this job checks functional
      # compatibility, so deprecation warnings are not treated as failures.
      - name: Run tests
        run: uv run --no-sync pytest -W ignore::DeprecationWarning
