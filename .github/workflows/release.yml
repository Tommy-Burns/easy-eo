name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install the artifact that is about to be published and exercise it. The
  # test suite runs against the source tree, so nothing else here would catch a
  # dropped package-data file or a tag that disagrees with __version__ — and a
  # PyPI release cannot be withdrawn.
  smoke:
    name: Smoke-test ${{ matrix.package }} (py${{ matrix.python-version }} · ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest and newest supported Python: the wheel is pure Python, so what
        # this catches is a dependency that has no wheel for one of the ends.
        python-version: ["3.10", "3.14"]
        package: [wheel]
        # conda-forge builds from the sdist, so it is checked too.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            package: sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # No extras: this is a plain `pip install easy-eo`, which is also what
      # lets the script check that a missing extra reports the documented error.
      - name: Install the built ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .smoke-venv
          if [ "$PACKAGE" = "sdist" ]; then
            uv pip install --python .smoke-venv dist/*.tar.gz
          else
            uv pip install --python .smoke-venv dist/*.whl
          fi

      # Run from the checkout but as a script, so sys.path[0] is scripts/ and
      # `import eeo` finds the install rather than the adjacent source tree.
      # The script fails loudly if that ever stops being true.
      - name: Smoke-test the installed package
        run: |
          if [ -f .smoke-venv/Scripts/python.exe ]; then
            python_bin=.smoke-venv/Scripts/python.exe
          else
            python_bin=.smoke-venv/bin/python
          fi
          expect=()
          case "$GITHUB_REF" in
            refs/tags/v*) expect=(--expect-version "${GITHUB_REF_NAME#v}") ;;
          esac
          "$python_bin" scripts/smoke_test_wheel.py "${expect[@]}"

  publish:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/easy-eo
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # skip (don't fail) if this version was
          # already uploaded, e.g. a re-run or an accidental duplicate tag.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC identity for keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Signs the files attached to the GitHub Release. The copies on PyPI are
      # signed separately by the publish job, which attaches PEP 740
      # attestations by default under Trusted Publishing.
      - name: Sign the release artifacts
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          # The release is created by the step below, which attaches the
          # bundles through its dist/* glob; this input only acts on `release`
          # events, which this tag-triggered workflow is not.
          release-signing-artifacts: false

      # Fails the release if the tag has no changelog entry, which is the
      # intent: notes and CHANGELOG.md cannot then drift apart.
      - name: Extract release notes from the changelog
        run: python3 scripts/extract_changelog.py "$GITHUB_REF_NAME" --output release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          prerelease=()
          case "${GITHUB_REF_NAME#v}" in
            *a*|*b*|*rc*|*dev*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            dist/*

  docs:
    name: Trigger Read the Docs build
    needs: publish
    runs-on: ubuntu-latest
    # Trigger build only for real version tags
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Trigger Read the Docs build
        run: >
          curl --fail --silent --show-error -X POST
          --data "token=${{ secrets.READTHEDOCS_WEBHOOK_TOKEN }}"
          --data "branches=${{ github.ref_name }}"
          "${{ secrets.READTHEDOCS_WEBHOOK_URL }}"
