name: Scorecard

# OpenSSF Scorecard rates the repository's supply-chain posture: pinned
# dependencies, scoped workflow permissions, vulnerability scanning, release
# provenance. Results are published so the README badge can read them.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  push:
    branches: [main]
  # Re-score when branch protection changes, since it is one of the checks.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results, which is what the badge reads
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required by scorecard-action: the checkout token must not be left
          # in the git config for the analysis step.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF API. Without this the badge has nothing to
          # read and renders "invalid repo path".
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Puts the findings in the repository's Security tab alongside CodeQL's.
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
